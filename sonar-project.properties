sonar.projectKey=kedland
sonar.projectName=Kedland International School
sonar.projectVersion=0.1.0

# ── Sources ──────────────────────────────────────────────────────────────────
sonar.sources=apps/web/src,apps/admin/src,apps/api/src,packages/types/src,packages/ui/src,packages/testing/src
sonar.tests=apps/web/src,apps/admin/src,apps/api/src,apps/api/test,apps/web/e2e,apps/admin/e2e,packages/types/src,packages/ui/src,packages/testing/src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e.ts,**/*.e2e-spec.ts,**/test/**

sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.turbo/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/*.config.*,\
  **/next-env.d.ts,\
  **/seeds/**

# ── Coverage ─────────────────────────────────────────────────────────────────
# agent_plan §7.4 — the gate is 80% on new code, enforced by the quality gate in
# SonarQube itself. These are the reports the scanner reads; each runner is also
# configured to fail locally below the same threshold, so a coverage regression
# is caught at the keyboard as well as in CI.
sonar.javascript.lcov.reportPaths=\
  apps/web/coverage/lcov.info,\
  apps/admin/coverage/lcov.info,\
  apps/api/coverage/lcov.info,\
  packages/types/coverage/lcov.info,\
  packages/ui/coverage/lcov.info,\
  packages/testing/coverage/lcov.info

sonar.typescript.tsconfigPaths=\
  apps/web/tsconfig.json,\
  apps/admin/tsconfig.json,\
  apps/api/tsconfig.json,\
  packages/types/tsconfig.json,\
  packages/ui/tsconfig.json,\
  packages/testing/tsconfig.json

# ── Duplication ──────────────────────────────────────────────────────────────
# The two Next apps are deliberately separate deployables (agent_plan §0.1) and
# a handful of their scaffolding files are near-identical by design: each app
# needs its own root layout, its own security-header block, and its own test
# bootstrap, because the *values* differ (indexed vs noindex, which CSP origins,
# which port) even though the shape does not.
#
# Anything that is genuinely one thing lives in packages/ — that is the rule.
# These exclusions are the accepted exceptions, and each one is named rather
# than hidden behind a wildcard so the list stays honest.
sonar.cpd.exclusions=\
  apps/*/next.config.ts,\
  apps/*/playwright.config.ts,\
  apps/*/vitest.config.ts,\
  apps/*/vitest.setup.ts,\
  apps/*/src/app/layout.tsx,\
  apps/*/src/app/not-found.tsx,\
  apps/*/src/app/loading.tsx,\
  apps/*/src/lib/fonts.ts,\
  apps/*/src/styles/globals.css

sonar.sourceEncoding=UTF-8
