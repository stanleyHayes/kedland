# Render Blueprint — Kedland API.
#
# The service, its Docker build, its health check and its whole environment
# contract live here rather than in the Render dashboard, so infrastructure
# changes arrive as reviewable diffs and a fresh environment is reproducible
# from the repo alone. See agent_plan.md §9.2.
#
# Deploy: Render dashboard → New → Blueprint → pick this repo. Render reads this
# file, builds apps/api/Dockerfile from the monorepo root, and prompts once for
# every `sync: false` secret.
#
# Notes carried into docs/runbook.md:
#   - The disk is ephemeral. Nothing durable is ever written to the container:
#     media goes to Cloudinary, state goes to MongoDB Atlas.
#   - `generateValue: true` mints a secret on first deploy. Rotating the JWT
#     keys signs every staff member out (fine — there are two or three of them).
#     Rotating REVALIDATE_SECRET requires updating Vercel in the same window.
#   - CORS_ORIGINS and REVALIDATE_SECRET are the two values that must stay in
#     lockstep with the Vercel projects. Changing either is a two-sided deploy.
services:
  - type: web
    name: kedland-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    # Build context is the monorepo root: the image needs packages/* too.
    dockerContext: .
    # Starter, not free. The public site is statically rendered so a sleeping
    # API never affects a parent browsing pages — but it *would* stall the
    # enquiry form and the dashboard login by ~50s after 15 minutes idle.
    # See agent_plan.md §12 open question 7.
    plan: starter
    region: frankfurt # closest Render region to Ghana
    # Readiness, not liveness. `/health` deliberately never touches the database
    # — it answers "the process is up" — so pointing the platform at it means a
    # deploy with an unreachable database goes green and serves nothing but the
    # health check itself. `/health/ready` pings Mongo and returns 503 when it
    # cannot, which is the signal Render needs to hold the deploy back.
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production

      # ── Database — MongoDB Atlas ─────────────────────────────────────────
      - key: MONGODB_URI # mongodb+srv:// from Atlas → Connect → Drivers
        sync: false
      - key: MONGODB_DB
        value: kedland

      # ── Auth ─────────────────────────────────────────────────────────────
      # Must differ from one another; the env schema refuses to boot otherwise.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d

      # ── CORS — an allowlist, never `*` ───────────────────────────────────
      # Custom domains are canonical. The `.vercel.app` hosts stay listed because
      # Vercel keeps serving them after a custom domain is added.
      #
      # Preview deployments get their own generated hostnames and are NOT covered
      # by this list — a preview build talking to the production API would be
      # blocked by the browser. That is deliberate: previews should point at a
      # preview API, not at the school's live data.
      - key: CORS_ORIGINS
        value: https://kedland.edu.gh,https://www.kedland.edu.gh,https://admin.kedland.edu.gh,https://kedland.vercel.app,https://kedland-admin.vercel.app

      # ── Media — Cloudinary signed uploads ────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Mail — Resend ────────────────────────────────────────────────────
      # Required in production: without these a parent's enquiry is persisted
      # but nobody is told about it.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Kedland International School <noreply@kedland.edu.gh>
      - key: MAIL_TO_SCHOOL # PENDING — the school's Google Workspace address
        sync: false

      # ── Spam — Cloudflare Turnstile ──────────────────────────────────────
      - key: TURNSTILE_SECRET_KEY
        sync: false

      # ── Staff invitations ────────────────────────────────────────────────
      # Where the dashboard lives, for the link in an invitation email. Without
      # it the API refuses to invite anyone — deliberately, rather than creating
      # an account whose invitation never arrives.
      - key: DASHBOARD_URL
        value: https://admin.kedland.edu.gh

      # ── Cache invalidation ───────────────────────────────────────────────
      # Must be a host that actually resolves, or publishing a post appears to
      # succeed while the public site keeps serving the old copy for up to an
      # hour.
      - key: REVALIDATE_WEBHOOK_URL
        value: https://kedland.edu.gh/api/revalidate
      - key: REVALIDATE_SECRET
        generateValue: true

      # ── Seed — consumed once to create the first admin account ───────────
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
